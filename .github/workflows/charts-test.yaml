---
name: "Charts: test"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: charts-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "0.7.0"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.19.0"
  # renovate: datasource=github-releases depName=k3d-io/k3d
  K3D_VERSION: "v5.9.0"
  # renovate: datasource=docker depName=rancher/k3s
  K3S_VERSION: "v1.37.2-k3s1"

jobs:
  changes:
    name: Changed charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.list.outputs.charts }}
      platform: ${{ steps.list.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: List changed charts
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          all=$(find helm/platform helm/apps -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ALL)
          fi
          # Shared inputs (CI, cluster.yaml) => test every chart.
          if [ "$files" = ALL ] || grep -qE '^(cluster\.yaml|hack/|\.github/workflows/charts-test\.yaml)' <<<"$files"; then
            charts="$all"
          else
            charts=$(grep -oE '^helm/(platform|apps)/[^/]+' <<<"$files" | sort -u || true)
          fi
          echo "$charts"
          echo "charts=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$charts")" >> "$GITHUB_OUTPUT"
          echo "platform=$(jq -R -s -c 'split("\n") | map(select(startswith("helm/platform/")))' <<<"$charts")" >> "$GITHUB_OUTPUT"

  install:
    name: Template ${{ matrix.chart }}
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: helm dependency build
        run: helm dependency build "${{ matrix.chart }}" || helm dependency update "${{ matrix.chart }}"
      - name: Template + kubeconform
        env:
          CHART: ${{ matrix.chart }}
        run: |
          set -euo pipefail
          n=$(basename "$CHART")
          helm template "$n" "$CHART" -n "$n" -f cluster.yaml --include-crds > /tmp/rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                /tmp/rendered.yaml
          # Every NetworkPolicy of ours must target at least one pod (labels can change on chart upgrades).
          python3 hack/netpol-check.py /tmp/rendered.yaml

  upgrade:
    # Latest release (v* tag) of the chart, then helm upgrade to this commit, on a throwaway k3d cluster.
    # Dependencies come from the same release (hack/chart-upgrade-test.sh).
    name: Upgrade ${{ matrix.chart }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.platform != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.changes.outputs.platform) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install k3d
        run: |
          curl -fsSL -o k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install k3d /usr/local/bin/k3d
      - name: Upgrade test
        env:
          K3S_IMAGE: rancher/k3s:${{ env.K3S_VERSION }}
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # What users run today: the latest release tag of the base branch.
          release=$(git describe --tags --abbrev=0 --match "v*" "$BASE")
          bash hack/chart-upgrade-test.sh "${{ matrix.chart }}" "$release"

  result:
    # Single required check for branch protection / Renovate automerge.
    name: Charts test result
    if: always()
    needs: [install, upgrade]
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          INSTALL: ${{ needs.install.result }}
          UPGRADE: ${{ needs.upgrade.result }}
        run: |
          echo "install=$INSTALL upgrade=$UPGRADE"
          [ "$INSTALL" = success ] || [ "$INSTALL" = skipped ]
          [ "$UPGRADE" = success ] || [ "$UPGRADE" = skipped ]
