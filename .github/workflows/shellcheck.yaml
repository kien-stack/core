name: "Shell: lint"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck every tracked .sh file
        run: |
          set -euo pipefail
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck
