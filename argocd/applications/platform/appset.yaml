# The base platform: one Application per entry of the list below (component + namespace).
# repoURL/revision: your fork (same as argocd/app-of-apps.yaml). Values: values.yaml + /cluster.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  # Data safety: this ApplicationSet never deletes an Application. Removing an entry below (an edit,
  # a merge, an update that turns a brick off by default) leaves the brick running, and deleting this
  # ApplicationSet leaves every brick and its data in place. Remove a brick on purpose:
  #   kubectl -n argocd delete application <brick>
  # Its databases (CloudNativePG Cluster, Prune=false,Delete=false) and volumes are kept.
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        # One entry = one component (helm/platform/<app>) deployed in <namespace>.
        # Disable a component: comment out its entry and push (ArgoCD removes it).
        elements:
          # Required: the other components and your apps depend on them
          - app: argocd
            namespace: argocd
            stage: "1"
          - app: traefik
            namespace: traefik
            stage: "1"
          - app: cert-manager
            namespace: cert-manager
            stage: "1"
          - app: external-secrets
            namespace: external-secrets
            stage: "3"
          # Optional
          - app: openebs
            namespace: openebs
            stage: "2"
          - app: cloudnative-pg
            namespace: cnpg-system
            stage: "2"
          # In-cluster S3 (SeaweedFS): default target of the Postgres backups (global.backup in cluster.yaml)
          - app: seaweedfs
            namespace: seaweedfs
            stage: "2"
          - app: infisical
            namespace: infisical
            stage: "3"
          - app: reloader
            namespace: reloader
            stage: "2"
          - app: metrics-server
            namespace: kube-system
            stage: "2"
          # Prometheus + Grafana (https://grafana.<domain>) + VictoriaMetrics + VictoriaLogs
          - app: monitoring
            namespace: monitoring
            stage: "3"
          # Health checks every 15 min: backups, WAL archiving, disk, certificates; heartbeat + webhook
          - app: checks
            namespace: checks
            stage: "3"
          # Off by default: uncomment to enable
          # - app: cilium
          #   namespace: kube-system
          #   stage: "1"
          # - app: external-dns
          #   namespace: external-dns
          #   stage: "1"
  # Progressive sync: deploy in order, one stage after the other (a stage waits until the
  # previous one is Healthy). Stage = the "stage" field of each element above.
  # An empty stage (all its components disabled) is skipped.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        # 1: network and certificates (argocd, traefik, cert-manager, cilium, external-dns)
        - matchExpressions:
            - {key: stage, operator: In, values: ["1"]}
        # 2: operators and storage
        - matchExpressions:
            - {key: stage, operator: In, values: ["2"]}
        # 3: secrets and monitoring, together: external-secrets stores need Infisical, Infisical's
        #    PodMonitor needs the monitoring CRDs, monitoring's secrets need external-secrets
        #    (also any component without a known stage)
        - matchExpressions:
            - {key: stage, operator: NotIn, values: ["1", "2"]}
  template:
    metadata:
      name: "{{ .app }}"
      labels:
        stage: '{{ index . "stage" | default "3" }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/kinopshq/core.git
        targetRevision: main
        path: "helm/platform/{{ .app }}"
        helm:
          releaseName: "{{ .app }}"
          # Your settings: see /cluster.yaml
          valueFiles:
            - values.yaml
            - ../../../cluster.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
