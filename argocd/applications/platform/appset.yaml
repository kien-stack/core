# The base platform: one Application per entry of the list below (brick + namespace).
# repoURL/revision: your fork (same as argocd/app-of-apps.yaml). Values: values.yaml + /cluster.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        # One entry = one brick (helm/platform/<app>) deployed in <namespace>.
        # Disable a brick: comment out its entry and push (ArgoCD removes it).
        elements:
          # Required: the other bricks and your apps depend on them
          - app: argocd
            namespace: argocd
          - app: traefik
            namespace: traefik
          - app: cert-manager
            namespace: cert-manager
          - app: external-secrets
            namespace: external-secrets
          # Optional
          - app: openebs
            namespace: openebs
          - app: cloudnative-pg
            namespace: cnpg-system
          - app: infisical
            namespace: infisical
          - app: reloader
            namespace: reloader
          - app: metrics-server
            namespace: kube-system
          # Off by default: uncomment to enable
          # - app: cilium
          #   namespace: kube-system
          # - app: external-dns
          #   namespace: external-dns
  template:
    metadata:
      name: "{{ .app }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/kien-stack/essential.git
        targetRevision: main
        path: "helm/platform/{{ .app }}"
        helm:
          releaseName: "{{ .app }}"
          # Your settings: see /cluster.yaml
          valueFiles:
            - values.yaml
            - ../../../cluster.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
