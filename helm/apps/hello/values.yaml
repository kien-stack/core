# global.domain / global.issuer come from /cluster.yaml (ArgoCD valueFiles).
# Secrets: create the folder /hello in the Infisical project "kubernetes" (env prod), add your secrets there:
# they land in the Secret hello-secrets (refreshed every minute), injected below as env vars.
# Remove this block if the app has no secrets.
infisicalSecrets:
  path: /hello
  env: prod
app-template:
  controller:
    annotations:
      # restart the pods when a secret changes (Reloader brick)
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: nginx
          tag: "1.27"
          digest: ""
        envFrom:
          # optional: false -> the pod waits (CreateContainerConfigError, kubelet retries) until
          # External Secrets creates hello-secrets; Reloader does not restart on Secret creation.
          - secretRef:
              name: hello-secrets
              optional: false
  service:
    main:
      ports:
        http:
          port: 80
  # https://hello.<domain>: listener https-hello of the cluster Gateway (global.gatewayHosts in cluster.yaml)
  route:
    main:
      enabled: true
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: https-hello
      rules:
        - backendRefs:
            - identifier: main
              port: 80
          matches:
            - path: {type: PathPrefix, value: /}
