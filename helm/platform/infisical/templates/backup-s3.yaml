{{- if (index .Values "cnpg-cluster" "objectStore" "enabled") }}
# S3 keys of the Postgres backups: copied by External Secrets (Kubernetes provider) from seaweedfs/seaweedfs-s3,
# the keys generated by the seaweedfs component. Read access: s3Readers in helm/platform/seaweedfs/values.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-s3-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: seaweedfs
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: seaweedfs-s3-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-backup-s3
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs
  target:
    name: infisical-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: seaweedfs-s3, property: accessKey}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: seaweedfs-s3, property: secretKey}
{{- end }}
