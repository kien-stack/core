# Self-hosted Infisical. Postgres: cnpg-cluster chart (below), Valkey: official valkey chart (valkey.io/valkey-helm), same namespace.
# Root secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL) are generated by install.sh, never in Git.
# Sync waves: ExternalSecrets stay in wave 0, workloads consuming their secrets go to wave 1.
# On fresh install the External Secrets webhook may not be ready yet: a rejected ExternalSecret then
# fails the sync in wave 0 and ArgoCD retries it, instead of waiting forever on the Deployment health.
infisical-standalone:
  infisical:
    deploymentAnnotations:
      argocd.argoproj.io/sync-wave: "1"
    replicaCount: 1
    rolloutOnEveryRender: false
    kubeSecretRef: infisical-secrets
    extraEnv:
      - name: DB_CONNECTION_URI
        valueFrom:
          secretKeyRef:
            name: infisical-cnpg
            key: DB_CONNECTION_URI
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        # 1Gi was OOMKilled during DB migrations on first start
        memory: 2Gi
  # Ingress is in our own templates/ingress.yaml
  ingress:
    enabled: false
    nginx:
      enabled: false
  postgresql:
    enabled: false
  redis:
    enabled: false
# Postgres: one small CloudNativePG cluster (infisical-cluster), database/owner "infisical".
# Credentials: secret infisical-cnpg (username, password, DB_HOST, DB_DATABASE, DB_CONNECTION_URI),
# generated by External Secrets (ClusterGenerator password-cluster-generator, external-secrets brick).
# Instances, StorageClass and backups: global.cnpg / global.backup in /cluster.yaml (same for every Postgres).
# The chart keeps the Cluster when ArgoCD would prune or delete it (Prune=false,Delete=false).
cnpg-cluster:
  cluster:
    # PodMonitor: CNPG metrics to Prometheus (Grafana "Databases/CloudNativePG" dashboard)
    podMonitor:
      enabled: true
    annotations:
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      # DB first: wave 0 with the ExternalSecrets it needs (infisical-cnpg role password);
      # ArgoCD waits for it to be Healthy (built-in CNPG health check, ArgoCD >= 2.13)
      # before syncing the Infisical workloads, Valkey and bootstrap Job (wave 1+).
      argocd.argoproj.io/sync-wave: "0"
    instances: 1
    storage:
      size: 5Gi
      storageClass: openebs-hostpath-retain
    walStorage:
      size: 1Gi
      storageClass: openebs-hostpath-retain
    # Continuous WAL archiving to the ObjectStore of templates/backup.yaml (global.backup in /cluster.yaml)
    plugins:
      - name: barman-cloud.cloudnative-pg.io
        # CRD default, explicit: otherwise ArgoCD shows the Cluster OutOfSync
        enabled: true
        isWALArchiver: true
        parameters:
          barmanObjectName: infisical-cluster-backup
    enableSuperuserAccess: false
    roles:
      - name: infisical
        ensure: present
        login: true
        superuser: false
        createdb: false
        # CRD defaults, explicit: otherwise ArgoCD (server-side diff) shows the Cluster OutOfSync forever
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: infisical-cnpg
  database:
    list:
      - name: infisical
        owner: infisical
        secretName: infisical-cnpg
# Valkey (BSD, Redis protocol) for Infisical queues/cache: official chart, no persistence (cache only).
# Service infisical-valkey:6379; password VALKEY_PASSWORD from infisical-secrets (ExternalSecret templates/secrets.yaml, never in Git).
valkey:
  workloadAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  auth:
    enabled: true
    usersExistingSecret: infisical-secrets
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: VALKEY_PASSWORD
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 256Mi

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# allow: namespaces -> pods (labels) on these ports only. openPorts: admission webhooks (API server).
networkPolicy:
  openPorts: []
  allow:
    - name: ingress
      from:
        - traefik
        - external-secrets
      pods:
        app: infisical-standalone
        component: infisical
      ports:
        - 8080
    - name: cnpg-operator
      from:
        - cnpg-system
      pods:
        cnpg.io/podRole: instance
      ports:
        - 5432
        - 8000
