cert-manager:
  # Certificates for the Gateway listeners (cert-manager.io/cluster-issuer on the Gateway)
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  crds:
    enabled: true
    keep: true
  prometheus:
    enabled: false

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# allow: namespaces -> pods (labels) on these ports only. openPorts: admission webhooks (API server).
networkPolicy:
  openPorts: [10250]
  allow: []
