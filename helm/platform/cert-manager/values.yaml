cert-manager:
  # Certificates for the Gateway listeners (cert-manager.io/cluster-issuer on the Gateway)
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  crds:
    enabled: true
    keep: true
  prometheus:
    enabled: false

# Ingress allowed from these namespaces only (templates/networkpolicy.yaml): 10250: admission webhook (API server)
networkPolicy:
  fromNamespaces: [monitoring]
  openPorts: [10250]
