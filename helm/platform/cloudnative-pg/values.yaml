cloudnative-pg:
  crds:
    create: true

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# allow: namespaces -> pods (labels) on these ports only. openPorts: admission webhooks (API server).
networkPolicy:
  openPorts:
    - 9443
  allow: []
# Barman Cloud plugin (CRD ObjectStore). Every Postgres with backups on (global.backup in cluster.yaml)
# gets its sidecar; the manager itself is one small pod.
plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
