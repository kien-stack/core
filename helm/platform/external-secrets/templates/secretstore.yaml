{{- /* Infisical stores. provider=infisical: one ClusterSecretStore per environment of the Infisical project
  (default "kubernetes", created by the infisical component): infisical-dev, infisical-staging, infisical-prod.
  One folder per app in the project; in the app: ExternalSecret on store infisical-prod, dataFrom.find.path: /<app>. */ -}}
{{- $s := .Values.global.secrets }}
{{- if eq $s.provider "infisical" }}
{{- range $env := ($s.infisical.environments | default (list "dev" "staging" "prod")) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Last wave: the stores stay invalid until the infisical component has created the identity; an earlier wave would
    # block the password generator (wave 1) that the infisical component needs to start.
    argocd.argoproj.io/sync-wave: "5"
  name: infisical-{{ $env }}
spec:
  provider:
    infisical:
      hostAPI: {{ $s.infisical.hostAPI }}
      auth:
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: external-secrets
            name: {{ $s.infisical.credentialsSecret }}
          clientSecret:
            key: clientSecret
            namespace: external-secrets
            name: {{ $s.infisical.credentialsSecret }}
      secretsScope:
        projectSlug: {{ $s.infisical.projectSlug }}
        environmentSlug: {{ $env }}
        secretsPath: /
        recursive: true
{{- end }}
{{- end }}
