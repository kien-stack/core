# Passwords generated in-cluster by External Secrets (ClusterGenerator password-cluster-generator), never in Git nor in install.sh.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: grafana-admin
spec:
  # "0" = generated once, never rotated (a refresh would regenerate the passwords).
  refreshInterval: "0"
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: {{`'{{ .pw }}'`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: pw
