# SeaweedFS: in-cluster S3 (Apache-2.0), one small instance. Target of the Postgres backups:
# bucket "postgres", endpoint http://seaweedfs-s3.seaweedfs.svc:8333.
# Keys: Secret seaweedfs/seaweedfs-s3, generated by External Secrets (templates/secrets.yaml), never in Git.
# Same disk as the cluster: protects against mistakes and corruption, not against losing the node.
seaweedfs:
  master:
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: openebs-hostpath
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
  volume:
    replicas: 1
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        size: 20Gi
        maxVolumes: 0
        storageClass: openebs-hostpath
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 512Mi}
  filer:
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
      storageClass: openebs-hostpath
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 512Mi}
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3
      createBuckets:
        - name: postgres
  s3:
    enabled: false

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# S3 (8333): every namespace (each Postgres archives from its own namespace); S3 keys required.
networkPolicy:
  openPorts: []
  allow:
    - name: s3
      from: []
      pods:
        app.kubernetes.io/component: filer
      ports:
        - 8333

# Namespaces allowed to copy the S3 keys (External Secrets) for their Postgres backups.
s3Readers:
  - infisical
