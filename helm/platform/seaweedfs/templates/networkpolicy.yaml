{{- if dig "networkPolicies" true (.Values.global | default dict) }}
{{- $np := .Values.networkPolicy | default dict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    {{- if dig "monitoring" true $np }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    {{- end }}
    {{- with (dig "openPorts" list $np) }}
    - ports:
      {{- range . }}
        - port: {{ . }}
      {{- end }}
    {{- end }}
{{- range $i, $r := (dig "allow" list $np) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $r.name | default $i }}
spec:
  podSelector:
    {{- if $r.pods }}
    matchLabels: {{- toYaml $r.pods | nindent 6 }}
    {{- else }} {}
    {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
      {{- range $r.from }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      {{- end }}
      {{- with $r.ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
