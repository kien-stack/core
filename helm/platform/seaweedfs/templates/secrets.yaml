# S3 keys generated in-cluster by External Secrets (ClusterGenerator password-cluster-generator), never in Git nor in install.sh.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # Wave -1: the secret exists before the filer starts (it reads its S3 identities from it).
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: seaweedfs-s3
spec:
  # "0" = generated once, never rotated (a refresh would regenerate the keys).
  refreshInterval: "0"
  target:
    name: seaweedfs-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        accessKey: {{`'{{ .ak }}'`}}
        secretKey: {{`'{{ .sk }}'`}}
        seaweedfs_s3_config: {{`'{"identities":[{"name":"admin","credentials":[{"accessKey":"{{ .ak }}","secretKey":"{{ .sk }}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: ak
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: sk
{{- range .Values.s3Readers }}
---
# Lets the namespace {{ . }} copy these keys (External Secrets, Kubernetes provider) for its Postgres backups.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-s3-reader-{{ . }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [seaweedfs-s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-s3-reader-{{ . }}
subjects:
  - {kind: ServiceAccount, name: seaweedfs-s3-reader, namespace: {{ . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: seaweedfs-s3-reader-{{ . }}}
{{- end }}
