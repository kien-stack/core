argo-cd:
  global:
    # The chart's own policies let anyone reach argocd-server: replaced by templates/networkpolicy.yaml
    networkPolicy:
      create: false
  configs:
    params:
      server.insecure: true
    cm:
      resource.exclusions: |
        - apiGroups: [cilium.io]
          kinds: [CiliumIdentity]
  server:
    ingress:
      enabled: false
    # https://argocd.<domain>: listener https-argocd of the cluster Gateway (traefik/traefik) gives the hostname
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: https-argocd
      rules:
        - matches:
            - path: {type: PathPrefix, value: /}
  dex:
    enabled: false
  notifications:
    enabled: false

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# allow: namespaces -> pods (labels) on these ports only. openPorts: admission webhooks (API server).
networkPolicy:
  openPorts: []
  allow:
    - name: ingress
      from:
        - traefik
      pods:
        app.kubernetes.io/name: argocd-server
      ports:
        - 8080
