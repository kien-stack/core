argo-cd:
  global:
    # The chart's own policies let anyone reach argocd-server: replaced by templates/networkpolicy.yaml
    networkPolicy:
      create: false
  configs:
    params:
      server.insecure: true
    cm:
      resource.exclusions: |
        - apiGroups: [cilium.io]
          kinds: [CiliumIdentity]
  server:
    ingress:
      enabled: false
    # https://argocd.<domain>: listener https-argocd of the cluster Gateway (traefik/traefik) gives the hostname
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: https-argocd
      rules:
        - matches:
            - path: {type: PathPrefix, value: /}
  dex:
    enabled: false
  notifications:
    enabled: false

# Ingress allowed from these namespaces only (templates/networkpolicy.yaml): UI through the Gateway
networkPolicy:
  fromNamespaces: [traefik, monitoring]
  openPorts: []
