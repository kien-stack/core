# Local PV hostpath only (homelab, k3s, bare metal). No replication: a volume lives on one node's disk.
openebs:
  engines:
    local:
      lvm:
        enabled: false
      zfs:
        enabled: false
      rawfile:
        enabled: false
      hostpath:
        enabled: true
    replicated:
      mayastor:
        enabled: false
  loki:
    enabled: false
  alloy:
    enabled: false
  localpv-provisioner:
    hostpathClass:
      basePath: /var/openebs/local
      isDefaultClass: false

# Ingress rules (templates/networkpolicy.yaml): deny by default, same namespace and monitoring allowed.
# allow: namespaces -> pods (labels) on these ports only. openPorts: admission webhooks (API server).
networkPolicy:
  openPorts: []
  allow: []
