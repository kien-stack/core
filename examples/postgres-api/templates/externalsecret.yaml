{{- /* Secrets from Infisical (project "kubernetes" by default): folder infisicalSecrets.path, environment
  infisicalSecrets.env -> Secret <release>-secrets, injected as env vars (see values.yaml). */ -}}
{{- with .Values.infisicalSecrets }}
{{- if .path }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-{{ .env | default "prod" }}
  target:
    name: {{ $.Release.Name }}-secrets
  dataFrom:
    - find:
        path: {{ .path | quote }}
        name: {regexp: ".*"}
{{- end }}
{{- end }}
