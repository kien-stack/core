# postgres-api: PostgREST (https://postgrest.org) serves the table "greetings" of its own Postgres over HTTP.
#   GET https://postgres-api.<domain>/greetings -> rows read from the database.
# Copying it? Replace every "postgres-api" below by your app name (= folder name = namespace = release).
# global.domain / global.issuer come from /cluster.yaml (ArgoCD valueFiles).

# App secrets from Infisical (project "kubernetes"): every secret of the folder /postgres-api, env prod,
# lands in the Secret postgres-api-secrets (templates/externalsecret.yaml), injected below as env vars.
# Create the folder BEFORE pushing the app (docs/BOOTSTRAP-APP.md), or remove this block.
infisicalSecrets:
  path: /postgres-api
  env: prod

# Postgres: one small CloudNativePG cluster postgres-api-cluster (service postgres-api-cluster-rw:5432),
# database and owner "app". Credentials: Secret postgres-api-cnpg (username, password, DB_HOST, DB_DATABASE,
# DB_CONNECTION_URI), password generated by External Secrets, never in Git.
cnpg-cluster:
  cluster:
    instances: 1
    annotations:
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      argocd.argoproj.io/sync-wave: "1"
    storage:
      size: 1Gi
      # openebs-hostpath (Essential). Cloud cluster without OpenEBS: your StorageClass
      storageClass: openebs-hostpath
    walStorage:
      size: 1Gi
      storageClass: openebs-hostpath
    enableSuperuserAccess: false
    roles:
      - name: app
        ensure: present
        login: true
        superuser: false
        createdb: false
        # CRD defaults, explicit: otherwise ArgoCD (server-side diff) shows the Cluster OutOfSync forever
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgres-api-cnpg
  database:
    list:
      - name: app
        owner: app
        secretName: postgres-api-cnpg

app-template:
  controller:
    annotations:
      # after the database (wave 1); restart the pods when a secret changes (Reloader brick)
      argocd.argoproj.io/sync-wave: "2"
      reloader.stakater.com/auto: "true"
    initContainers:
      # Schema + sample row, idempotent. psql reads the standard PG* env vars. Your app: run its own migrations.
      migrate:
        image:
          repository: ghcr.io/cloudnative-pg/postgresql
          tag: "18-standard-trixie"
          digest: ""
        env: &pg
          PGHOST: {valueFrom: {secretKeyRef: {name: postgres-api-cnpg, key: DB_HOST}}}
          PGDATABASE: {valueFrom: {secretKeyRef: {name: postgres-api-cnpg, key: DB_DATABASE}}}
          PGUSER: {valueFrom: {secretKeyRef: {name: postgres-api-cnpg, key: username}}}
          PGPASSWORD: {valueFrom: {secretKeyRef: {name: postgres-api-cnpg, key: password}}}
          PGPORT: "5432"
        envFrom:
          - secretRef:
              name: postgres-api-secrets
              optional: true
        command: [sh, -c]
        args:
          - |
            until pg_isready -q; do echo waiting for postgres; sleep 2; done
            psql -v ON_ERROR_STOP=1 -v msg="${GREETING:-hello from postgres}" <<'SQL'
            CREATE TABLE IF NOT EXISTS greetings (id serial PRIMARY KEY, message text NOT NULL, created_at timestamptz DEFAULT now());
            INSERT INTO greetings (message) SELECT :'msg' WHERE NOT EXISTS (SELECT 1 FROM greetings);
            SQL
    containers:
      main:
        image:
          # your image
          repository: postgrest/postgrest
          tag: v14.18
          digest: ""
        env:
          <<: *pg
          # bare libpq URI: host, db, user, password come from the PG* env vars above
          # (or one variable: DB_CONNECTION_URI from the Secret postgres-api-cnpg)
          PGRST_DB_URI: postgresql://
          PGRST_DB_SCHEMAS: public
          # Demo only: anonymous HTTP requests run as the owner (read AND write). Production: a read-only role + JWT.
          PGRST_DB_ANON_ROLE: app
          PGRST_SERVER_PORT: "3000"
          PGRST_ADMIN_SERVER_PORT: "3001"
        # app secrets from Infisical (folder /postgres-api) as env vars
        envFrom:
          - secretRef:
              name: postgres-api-secrets
              optional: true
        probes:
          # /ready answers 200 only when PostgREST is connected to the database
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: /ready, port: 3001}
              periodSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: /live, port: 3001}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  service:
    main:
      ports:
        http:
          port: 3000
  # https://postgres-api.<domain>: add "postgres-api" to global.gatewayHosts in cluster.yaml (listener https-postgres-api)
  route:
    main:
      enabled: true
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: https-postgres-api
      rules:
        - backendRefs:
            - identifier: main
              port: 3000
          matches:
            - path: {type: PathPrefix, value: /}

# Ingress rules (templates/networkpolicy.yaml): deny by default; same namespace (app -> postgres) and monitoring allowed.
networkPolicy:
  allow:
    - name: ingress
      from: [traefik]
      pods:
        app.kubernetes.io/name: postgres-api
      ports: [3000]
    - name: cnpg-operator
      from: [cnpg-system]
      pods:
        cnpg.io/podRole: instance
      ports: [5432, 8000]
